version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: hydrovision_postgres
    environment:
      POSTGRES_DB: hydrovision_db
      POSTGRES_USER: hydrovision
      POSTGRES_PASSWORD: hydrovision_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrovision -d hydrovision_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hydrovision_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: hydrovision_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hydrovision_backend
    environment:
      - DATABASE_URL=postgresql://hydrovision:hydrovision_pass@postgres:5432/hydrovision_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hydrovision_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
